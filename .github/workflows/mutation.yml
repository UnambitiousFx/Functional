name: Mutation testing

# Non-blocking for now: no break-at, reports only. See issue #124 for the rollout.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  stryker:
    name: Stryker (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [Functional.Tests, Functional.xunit.Tests]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Run Stryker
        working-directory: test/${{ matrix.project }}
        run: dotnet stryker --output StrykerOutput

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-${{ matrix.project }}
          path: test/${{ matrix.project }}/StrykerOutput/reports/
          if-no-files-found: warn
